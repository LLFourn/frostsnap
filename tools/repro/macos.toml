# The macOS build's own pins, read together with repro.toml.

host = "aarch64-apple-darwin"
# Xcode 27's lipo rejects the two-arch -verify_arch that Flutter 3.38.5 passes.
archs = ["arm64"]

# GitHub's xcode-27 runner image keeps this Xcode at this same path.
[xcode]
path = "/Applications/Xcode_27.1.app"
build = "27A9275"
tree_sha256 = "95a5fc7eeec0a1ce105cbeea76d3bdc216decd4bf74fb2f963566a0435bb4615"

# CocoaPods only runs during the build, so the OS's Ruby is acceptable, but
# the gems are pinned: versions that still support Ruby 2.6.
[ruby]
path = "/usr/bin/ruby"
version = "2.6.10"

