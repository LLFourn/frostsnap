# Every input the reproducible app build needs, pinned by content hash.
# Dependencies pinned by a lockfile are not repeated here: Cargo.lock and
# pubspec.lock carry a checksum per crate and package, and cargo and pub check
# them on download.

root = "/var/tmp/frostsnap-repro"

