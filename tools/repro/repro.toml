# Flutter's bootstrap resolves flutter_tools with `pub upgrade` and no
# lockfile; this is the lockfile that produced at the pinned commit, which the
# tool enforces instead. Relative to this file.
[flutter.tools_lockfile]
path = "locks/flutter_tools-3.38.5.pubspec.lock"
sha256 = "246d46461bdfa97d5734a188d16fc2741dddc88d111eeb49dfe6bc6087bc771f"

# Keyed by Flutter's target platform. A Linux build with no pin yet stops
# after the download and prints the hash to pin here; it can only be taken on
# Linux.
[flutter.cache]
macos = "9a039dd13713c28267535f4cf83a14fa94b50303407525ce0b9cd166b1d8ee4b"
linux-arm64 = "edf342fddc7e1516e1c303cae0f645751fd8251699adab1b980ca6c737115e70"
linux-x64 = "1434df18a763154fe49d1699a04f3639118807a4c922d03c75b0ae5bbe3a4b02"

