[package]
name = "sim_regtest"
version = "0.1.0"
edition = "2021"
publish = false

# A sim-only Bitcoin regtest backend: spawns a real `bitcoind` + `electrs` (via the `electrsd`
# crate, which downloads pinned binaries) and acts as a faucet for the sim wallet. Not in the
# workspace default-members — the download build scripts shouldn't run on a plain root build.

[dev-dependencies]
base64 = "0.22"
# Chains the forged leaf to its issuer in the signed_by test, the same way the app's
# base verifier would.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = [
    "ring",
    "alloc",
] }

[dependencies]
anyhow = "1"
serde_json = { workspace = true }
bitcoin = { workspace = true }
# Expands the app's multipath `<0;1>` descriptor into the receive/change pair bitcoind accepts.
miniscript = "12.3"
# The standalone binary catches SIGINT/SIGTERM so it can drop Regtest (which reaps the
# bitcoind/electrs children) on shutdown rather than orphaning them.
ctrlc = { version = "3", features = ["termination"] }
electrsd = { version = "0.38", default-features = false, features = [
    "bitcoind_download",
    "bitcoind_28_2",
    "esplora_a33e97e1",
    "legacy",
] }

# The electrum front doors. `ring` throughout, matching frostsnap_coordinator, so the
# client and server halves of an e2e handshake share one crypto provider.
tokio = { version = "1.45", features = [
    "net",
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "sync",
    "io-util",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "tls12",
    "ring",
] }
rustls = { version = "0.23", default-features = false, features = [
    "tls12",
    "ring",
] }
rcgen = { version = "0.13", default-features = false, features = [
    "crypto",
    "ring",
] }
sha2 = { workspace = true }
hex = "0.4"
# SO_LINGER on an accepted socket, so dropping a session RESETS it rather than closing it
# politely. tokio deprecated its own `set_linger` because a NON-zero linger blocks the thread on
# drop; zero is the opposite — an immediate RST — so reach for the socket directly.
socket2 = "0.6"
