[package]
name = "widget_simulator"
version = "0.1.0"
edition = "2024"

[lints.rust]
# Expands frostsnap_widgets::demo_widget!, whose prefill cfg is evaluated here.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(prefill_words)'] }

[dependencies]
frostsnap_widgets = { workspace = true, features = ["std"] }
frostsnap_core.workspace = true
embedded-graphics.workspace = true
embedded-graphics-simulator = "0.8.0"
rand.workspace = true
bitcoin.workspace = true
frost_backup.workspace = true
